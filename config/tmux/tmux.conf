# tmux: managed by dotfiles (https://github.com/gweilo852/dotfiles)
#
# Portable across macOS, Linux (VDI), WSL and Unraid. No plugins.
# Works with tmux 2.6 and later; tmux 3.2 or later is recommended.
# Machine-specific settings belong in ~/.tmux.conf.local (loaded last).
# Reload: prefix r. Keys and workflows: docs/tmux.md.

# ------------------------------------------------------------
# Terminal and colour
# ------------------------------------------------------------

# tmux-256color when this machine has its terminfo entry, else the
# older screen-256color, which every system has.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# True colour for WezTerm and other 256-colour terminals.
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc,wezterm:Tc"

set -g focus-events on

# ------------------------------------------------------------
# Behaviour
# ------------------------------------------------------------

set -g history-limit 100000
set -sg escape-time 10
set -g mouse on
set -g display-time 2000
set -g status-interval 5

# Windows and panes start at 0 (same convention on every machine).
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g remain-on-exit off

# Named windows keep their names (for example "claude", "codex", "infra").
set -g automatic-rename off
set -g allow-rename off

# Activity and bells: an agent that finishes or asks for input marks its
# window. No sound, no flashing.
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action any

# Copy these from the attaching client into the session. Set as one list,
# which works with both old (string) and new (array) tmux versions.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID TMUX_HOST_LABEL"

# ------------------------------------------------------------
# Keys
# ------------------------------------------------------------

set -g prefix C-b
set -g prefix2 None
set -g status-keys emacs
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane movement (h j k l) and resizing (H J K L, repeatable).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Sessions: prefix C asks for a name, then creates or switches to it.
bind C command-prompt -p "session name:" "new-session -A -s '%%'"
bind S choose-tree -s

# Direct window navigation, as before on every machine.
bind -n F9 last-window
bind -n F10 next-window

# ------------------------------------------------------------
# Copy mode and clipboard
# ------------------------------------------------------------
# prefix [ enters copy mode. v selects, C-v toggles a rectangle,
# y or Enter copies, q leaves. prefix ] pastes the tmux buffer.
#
# A copy reaches the system clipboard in two ways:
# 1. OSC 52: tmux sends the text to the terminal. WezTerm puts it on the
#    clipboard of the machine you type on, also over SSH (VDI, Unraid).
# 2. clipboard.sh: pbcopy, wl-copy, xclip, xsel or clip.exe on this
#    machine, when one is usable. It does nothing on a headless system.
set -s set-clipboard on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# The helper lives next to the real tmux.conf, which ~/.tmux.conf links
# to. DOTFILES_TMUX_DIR overrides the location (used by the tests).
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'sh "${DOTFILES_TMUX_DIR:-$(dirname "$(readlink "$HOME/.tmux.conf")")}/clipboard.sh"'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'sh "${DOTFILES_TMUX_DIR:-$(dirname "$(readlink "$HOME/.tmux.conf")")}/clipboard.sh"'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'sh "${DOTFILES_TMUX_DIR:-$(dirname "$(readlink "$HOME/.tmux.conf")")}/clipboard.sh"'

# ------------------------------------------------------------
# Status bar: subdued Catppuccin Macchiato
# ------------------------------------------------------------
# Text colours carry the meaning; only the current window has a
# background. Palette: base #24273a, mantle #1e2030, surface0 #363a4f,
# surface1 #494d64, overlay0 #6e738d, overlay1 #8087a2, text #cad3f5,
# subtext0 #a5adcb, blue #8aadf4, mauve #c6a0f6, yellow #eed49f,
# red #ed8796, green #a6da95.

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e2030,fg=#8087a2"

# Left: host label (TMUX_HOST_LABEL, else the short host name), session,
# and a yellow dot while the prefix key is active.
set -g status-left-length 60
set -g status-left "#[fg=#c6a0f6,bold] #{?TMUX_HOST_LABEL,#{TMUX_HOST_LABEL},#{host_short}} #[fg=#494d64,nobold]│ #[fg=#8aadf4]#S #{?client_prefix,#[fg=#eed49f]● ,}#[default]"

# Windows: the current one on a surface0 background; Z marks a zoomed pane.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6e738d] #I:#W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=#cad3f5,bg=#363a4f,bold] #I:#W#{?window_zoomed_flag, Z,} #[default]"
setw -g window-status-activity-style "fg=#eed49f"
setw -g window-status-bell-style "fg=#ed8796"

# Right: copy-mode marker, host, time and date.
set -g status-right-length 80
set -g status-right "#{?pane_in_mode,#[fg=#eed49f]COPY ,}#[fg=#6e738d]#H #[fg=#494d64]│ #[fg=#a5adcb]%H:%M #[fg=#6e738d]%d %b "

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g display-panes-colour "#6e738d"
set -g display-panes-active-colour "#8aadf4"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"
setw -g mode-style "bg=#494d64,fg=#cad3f5"
setw -g clock-mode-colour "#8aadf4"

# ------------------------------------------------------------
# Minimal profile for Unraid
# ------------------------------------------------------------
# Unraid has no desktop: copy uses OSC 52 only, and the status bar drops
# the date. `tmux show -gv @dotfiles_profile` prints the active profile.
set -g @dotfiles_profile standard
if-shell '[ -f "${DOTFILES_SYSROOT:-}/etc/unraid-version" ]' \
  'set -g @dotfiles_profile minimal ; \
   bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel ; \
   bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel ; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel ; \
   set -g status-right "#{?pane_in_mode,#[fg=#eed49f]COPY ,}#[fg=#6e738d]#H #[fg=#494d64]│ #[fg=#a5adcb]%H:%M "'

# ------------------------------------------------------------
# Local overrides (not managed). See config/tmux/tmux.conf.local.example.
# ------------------------------------------------------------
if-shell '[ -r "$HOME/.tmux.conf.local" ]' 'source-file "$HOME/.tmux.conf.local"'
