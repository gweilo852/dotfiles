# ============================================================
# tmux: managed by dotfiles (https://github.com/gweilo852/dotfiles)
# ============================================================

# Terminal / colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Behaviour
set -g history-limit 100000
set -sg escape-time 0
set -g mouse off

# Windows/panes start at 0 — same convention as the Beast
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# Don't leave dead panes around
set -g remain-on-exit off

# Keep normal Ctrl-B prefix
set -g prefix C-b
set -g prefix2 None

# Handy direct navigation used on the Beast
bind-key -n F9 last-window
bind-key -n F10 next-window

# Don't let programs rename our project windows
set -g automatic-rename off
set -g allow-rename off

# ------------------------------------------------------------
# Ghost Tower colour scheme
# ------------------------------------------------------------

# Main status bar
set -g status-position bottom
set -g status-style "bg=#0F172A,fg=#CBD5E1"

# Left: project/session
set -g status-left-length 50
set -g status-left "#[fg=#0F172A,bg=#A78BFA,bold] #{E:TMUX_HOST_LABEL} #[fg=#A78BFA,bg=#0F172A] #[fg=#22D3EE,bold]#S #[default]"

# Windows
setw -g window-status-format "#[fg=#64748B] #I:#W "
setw -g window-status-current-format "#[fg=#0F172A,bg=#22D3EE,bold] #I:#W #[fg=#22D3EE,bg=#0F172A]"

# Right: host + time
set -g status-right-length 80
set -g status-right "#[fg=#64748B]#H #[fg=#FBBF24,bold]%H:%M #[fg=#64748B]%d %b"

# Pane borders
set -g pane-border-style "fg=#334155"
set -g pane-active-border-style "fg=#22D3EE"

# Messages / command prompt
set -g message-style "bg=#A78BFA,fg=#0F172A,bold"
set -g message-command-style "bg=#22D3EE,fg=#0F172A,bold"

# Activity
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=#FBBF24,bold"

# Larger status refresh interval is plenty
set -g status-interval 5

set -ga update-environment "TMUX_HOST_LABEL"

# Machine-specific settings. Not managed.
source-file -q ~/.tmux.conf.local
